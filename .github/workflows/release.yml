name: Release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Existing commit on master to release; defaults to this ref
        required: false
        type: string
      version:
        description: Existing changelog version, for example v0.37.0
        required: true
        type: string
  workflow_call:
    inputs:
      sha:
        description: Exact staged release commit
        required: true
        type: string
      base_sha:
        description: Expected current master before promotion
        required: true
        type: string
      branch:
        description: Temporary automation branch to remove after success
        required: false
        type: string
      version:
        description: Existing changelog version, for example v0.37.0
        required: true
        type: string
    outputs:
      sha:
        description: Released commit
        value: ${{ jobs.release.outputs.sha }}
      url:
        description: GitHub release URL
        value: ${{ jobs.release.outputs.url }}

permissions:
  contents: read

concurrency:
  group: v8-release
  cancel-in-progress: false

jobs:
  test:
    name: Test exact release commit
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      sha: ${{ inputs.sha || github.sha }}

  leakcheck:
    name: Leakcheck exact release commit
    permissions:
      contents: read
    uses: ./.github/workflows/leakcheck.yml
    with:
      sha: ${{ inputs.sha || github.sha }}

  release:
    name: Promote and release exact commit
    needs: [test, leakcheck]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
      url: ${{ steps.publish.outputs.url }}
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha || github.sha }}

      - id: publish
        name: Fast-forward master and create immutable release
        env:
          EXPECTED_BASE_SHA: ${{ inputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ inputs.branch }}
          RELEASE_VERSION: ${{ inputs.version }}
          TESTED_SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          changelog_version="$(sed -nE 's/^## \[(v[0-9]+\.[0-9]+\.[0-9]+)\].*/\1/p' CHANGELOG.md | head -n1)"
          test "$changelog_version" = "$RELEASE_VERSION"

          git fetch origin master --tags
          remote_master="$(git rev-parse refs/remotes/origin/master)"
          existing_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_VERSION" | awk 'NR == 1 { print $1 }')"
          resolved_tag=""
          if [[ -n "$existing_tag" ]]; then
            git fetch origin "refs/tags/$RELEASE_VERSION:refs/tags/$RELEASE_VERSION"
            resolved_tag="$(git rev-list -n1 "$RELEASE_VERSION")"
            test "$resolved_tag" = "$TESTED_SHA"
          fi

          if [[ -n "$EXPECTED_BASE_SHA" ]]; then
            [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            git merge-base --is-ancestor "$EXPECTED_BASE_SHA" "$TESTED_SHA"
            if [[ "$remote_master" == "$EXPECTED_BASE_SHA" ]]; then
              git push origin "$TESTED_SHA:refs/heads/master"
              remote_master="$TESTED_SHA"
            elif [[ "$remote_master" != "$TESTED_SHA" ]]; then
              echo "master moved from expected base $EXPECTED_BASE_SHA to $remote_master" >&2
              exit 1
            fi
          elif [[ "$remote_master" != "$TESTED_SHA" ]]; then
            if [[ "$resolved_tag" != "$TESTED_SHA" ]] || ! git merge-base --is-ancestor "$TESTED_SHA" "$remote_master"; then
              echo "manual release target is neither current master nor an existing ancestor tag" >&2
              exit 1
            fi
          fi

          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test -n "$existing_tag"
            release_url="$(gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          else
            (
              echo "Full changelog ⇒ [$RELEASE_VERSION](https://github.com/${GITHUB_REPOSITORY,,}/blob/$RELEASE_VERSION/CHANGELOG.md)"
              echo
              awk -v version="$RELEASE_VERSION" '
                /^## \[/ && $2 != "[" version "]" { inside = 0 }
                inside && (inside == 2 || $0) {
                  sub(/^#/, "")
                  print
                  if ($0) { inside = 2 }
                }
                /^## \[/ && $2 == "[" version "]" { inside = 1 }
              ' CHANGELOG.md
            ) >"$RUNNER_TEMP/release-notes.md"
            if [[ -n "$existing_tag" ]]; then
              release_url="$(gh release create "$RELEASE_VERSION" \
                --repo "$GITHUB_REPOSITORY" \
                --verify-tag \
                --title "$RELEASE_VERSION" \
                --notes-file "$RUNNER_TEMP/release-notes.md")"
            else
              release_url="$(gh release create "$RELEASE_VERSION" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$TESTED_SHA" \
                --title "$RELEASE_VERSION" \
                --notes-file "$RUNNER_TEMP/release-notes.md")"
            fi
          fi

          if [[ -n "$RELEASE_BRANCH" && "$RELEASE_BRANCH" == automation/v8-* ]]; then
            if git ls-remote --exit-code --heads origin "refs/heads/$RELEASE_BRANCH" >/dev/null 2>&1; then
              git push origin --delete "$RELEASE_BRANCH"
            fi
          fi
          echo "sha=$TESTED_SHA" >>"$GITHUB_OUTPUT"
          echo "url=$release_url" >>"$GITHUB_OUTPUT"
          {
            echo "Released: $RELEASE_VERSION"
            echo "Commit: $TESTED_SHA"
            echo "Release: $release_url"
          } >>"$GITHUB_STEP_SUMMARY"
