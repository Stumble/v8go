name: V8 Build

on:
  workflow_dispatch:
    inputs:
      v8_hash:
        description: Exact V8 Stable branch commit; defaults to deps/v8_hash
        required: false
        type: string
      v8_version:
        description: Official non-PGO V8 tag at v8_hash; empty means candidate only
        required: false
        type: string
      publish:
        description: Prepare a staged release branch after candidate validation
        default: false
        required: true
        type: boolean
  workflow_call:
    inputs:
      sha:
        description: Trusted v8go base commit
        required: false
        type: string
      v8_hash:
        description: Exact V8 Stable branch commit
        required: true
        type: string
      v8_version:
        description: Official non-PGO V8 tag at v8_hash; empty means candidate only
        required: false
        type: string
      publish:
        description: Prepare a staged release branch after candidate validation
        default: false
        required: false
        type: boolean
    outputs:
      staged:
        description: Whether a tagged candidate was staged
        value: ${{ jobs.stage.outputs.staged }}
      sha:
        description: Exact staged release commit
        value: ${{ jobs.stage.outputs.sha }}
      base_sha:
        description: Base commit from which the release was staged
        value: ${{ jobs.stage.outputs.base_sha }}
      branch:
        description: Temporary automation branch
        value: ${{ jobs.stage.outputs.branch }}
      version:
        description: Staged v8go release version
        value: ${{ jobs.stage.outputs.version }}

permissions:
  contents: read

jobs:
  build_common:
    name: Build architecture-independent files
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      v8_hash: ${{ steps.target.outputs.v8_hash }}
      base_sha: ${{ steps.target.outputs.base_sha }}
    steps:
      - name: Checkout trusted build definition
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          fetch-depth: 1
          ref: ${{ inputs.sha }}

      - id: target
        name: Validate build target
        env:
          REQUESTED_V8_HASH: ${{ inputs.v8_hash }}
        run: |
          set -euo pipefail
          v8_hash="$REQUESTED_V8_HASH"
          v8_hash="${v8_hash:-$(tr -d '[:space:]' < deps/v8_hash)}"
          [[ "$v8_hash" =~ ^[0-9a-f]{40}$ ]] || {
            echo "invalid V8 hash" >&2
            exit 1
          }
          echo "v8_hash=$v8_hash" >>"$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Checkout exact V8 source
        env:
          V8_HASH: ${{ steps.target.outputs.v8_hash }}
        run: |
          set -euo pipefail
          git -C deps/v8 fetch --depth=1 origin "$V8_HASH"
          git -C deps/v8 checkout --detach "$V8_HASH"
          test "$(git -C deps/v8 rev-parse HEAD)" = "$V8_HASH"

      - name: Apply maintained patches
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(patches/*.patch)
          for patch_file in "${patches[@]}"; do
            if patch --dry-run --forward --batch -p1 -i "$patch_file" >/dev/null 2>&1; then
              patch --forward --batch -p1 -i "$patch_file"
            elif ! patch --dry-run --reverse --batch -p1 -i "$patch_file" >/dev/null 2>&1; then
              echo "patch no longer applies: $patch_file" >&2
              exit 1
            fi
          done

      - name: Create include files
        run: cd deps && ./build_common.py

      - name: Hash common files
        run: |
          set -euo pipefail
          cd deps
          find include include_libcxx include_libcxxabi -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum >include.SHA256SUMS
          sha256sum --check include.SHA256SUMS

      - name: Upload common files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: include-${{ steps.target.outputs.v8_hash }}
          if-no-files-found: error
          path: |
            deps/include/
            deps/include_libcxx/
            deps/include_libcxxabi/
            deps/include.SHA256SUMS
          retention-days: 2

  build:
    name: Build V8 for ${{ matrix.target.os }} ${{ matrix.target.arch }}
    needs: build_common
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: linux
            arch: amd64
            runner: ubuntu-22.04
          - os: linux
            arch: arm64
            runner: ubuntu-22.04
          - os: darwin
            arch: amd64
            runner: macos-15
          - os: darwin
            arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.target.runner }}
    steps:
      - name: Checkout trusted build definition
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          fetch-depth: 1
          ref: ${{ inputs.sha }}

      - name: Install Linux ARM64 cross compiler
        if: matrix.target.os == 'linux' && matrix.target.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-aarch64-linux-gnu

      - name: Install pinned Python build requirements
        if: runner.os == 'macOS'
        env:
          PIP_BREAK_SYSTEM_PACKAGES: '1'
        run: >-
          python3 -m pip install
          --disable-pip-version-check
          --no-deps
          --only-binary=:all:
          --require-hashes
          -r deps/build-requirements.txt

      - name: Install CCache
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache
          sudo update-ccache-symlinks
          echo "/usr/lib/ccache" >>"$GITHUB_PATH"

      - name: Install CCache
        if: runner.os == 'macOS'
        run: |
          brew install ccache
          echo "$(brew --prefix ccache)/libexec" >>"$GITHUB_PATH"

      - name: Checkout exact V8 source
        env:
          V8_HASH: ${{ needs.build_common.outputs.v8_hash }}
        run: |
          set -euo pipefail
          git -C deps/v8 fetch --depth=1 origin "$V8_HASH"
          git -C deps/v8 checkout --detach "$V8_HASH"
          test "$(git -C deps/v8 rev-parse HEAD)" = "$V8_HASH"

      - name: Apply maintained patches
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(patches/*.patch)
          for patch_file in "${patches[@]}"; do
            if patch --dry-run --forward --batch -p1 -i "$patch_file" >/dev/null 2>&1; then
              patch --forward --batch -p1 -i "$patch_file"
            elif ! patch --dry-run --reverse --batch -p1 -i "$patch_file" >/dev/null 2>&1; then
              echo "patch no longer applies: $patch_file" >&2
              exit 1
            fi
          done

      - name: Configure CCache
        run: |
          ccache_dir="$RUNNER_TEMP/ccache"
          mkdir -p "$ccache_dir"
          echo "CCACHE_DIR=$ccache_dir" >>"$GITHUB_ENV"
          echo "CCACHE_CPP2=yes" >>"$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=time_macros" >>"$GITHUB_ENV"

      - name: Restore exact CCache
        id: restore-ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ccache
          key: libv8:ccache:${{ matrix.target.os }}:${{ matrix.target.arch }}:${{ needs.build_common.outputs.v8_hash }}:${{ hashFiles('deps/build.py', 'deps/build-requirements.txt') }}

      - name: Restore exact V8 build cache
        id: restore-v8-build
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: deps/.build/${{ matrix.target.os }}_${{ matrix.target.arch }}
          key: libv8:v8build:${{ matrix.target.os }}:${{ matrix.target.arch }}:${{ needs.build_common.outputs.v8_hash }}:${{ hashFiles('deps/build.py', 'deps/build-requirements.txt') }}

      - name: Update depot_tools fetch config
        run: |
          set -euo pipefail
          git -C deps/depot_tools config --unset-all remote.origin.fetch || true
          git -C deps/depot_tools config --add remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'

      - name: Build exact V8 target
        run: >-
          ./deps/build.py
          --ccache
          --verbose
          --clang
          --arch ${{ matrix.target.arch }}
          --os ${{ matrix.target.os }}

      - name: Hash platform files
        env:
          PLATFORM: ${{ matrix.target.os }}_${{ matrix.target.arch }}
        run: |
          set -euo pipefail
          cd "deps/$PLATFORM"
          sha256sum lib*.a libmanifest >SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Save exact V8 build cache
        if: always() && steps.restore-v8-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: deps/.build/${{ matrix.target.os }}_${{ matrix.target.arch }}
          key: libv8:v8build:${{ matrix.target.os }}:${{ matrix.target.arch }}:${{ needs.build_common.outputs.v8_hash }}:${{ hashFiles('deps/build.py', 'deps/build-requirements.txt') }}

      - name: Save exact CCache
        if: always() && steps.restore-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ccache
          key: libv8:ccache:${{ matrix.target.os }}:${{ matrix.target.arch }}:${{ needs.build_common.outputs.v8_hash }}:${{ hashFiles('deps/build.py', 'deps/build-requirements.txt') }}

      - name: Show CCache status
        run: ccache -s

      - name: Upload platform files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target.os }}_${{ matrix.target.arch }}-${{ needs.build_common.outputs.v8_hash }}
          if-no-files-found: error
          path: |
            deps/${{ matrix.target.os }}_${{ matrix.target.arch }}/
            !deps/${{ matrix.target.os }}_${{ matrix.target.arch }}/vendor.go
          retention-days: 2

  assemble:
    name: Assemble and verify candidate
    needs: [build_common, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout trusted candidate base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          ref: ${{ needs.build_common.outputs.base_sha }}

      - name: Remove previous generated files
        run: |
          set -euo pipefail
          find deps -maxdepth 2 -type f -name libmanifest -print0 \
            | xargs -0 -r -n1 dirname \
            | xargs -r rm -rf
          rm -rf deps/include deps/include_libcxx deps/include_libcxxabi

      - name: Download common files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: include-${{ needs.build_common.outputs.v8_hash }}
          path: deps

      - name: Download Darwin AMD64 files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: darwin_amd64-${{ needs.build_common.outputs.v8_hash }}
          path: deps/darwin_amd64

      - name: Download Darwin ARM64 files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: darwin_arm64-${{ needs.build_common.outputs.v8_hash }}
          path: deps/darwin_arm64

      - name: Download Linux AMD64 files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux_amd64-${{ needs.build_common.outputs.v8_hash }}
          path: deps/linux_amd64

      - name: Download Linux ARM64 files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux_arm64-${{ needs.build_common.outputs.v8_hash }}
          path: deps/linux_arm64

      - name: Verify candidate checksums
        run: |
          set -euo pipefail
          (cd deps && sha256sum --check include.SHA256SUMS)
          for platform in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            (cd "deps/$platform" && sha256sum --check SHA256SUMS)
          done

      - name: Update candidate metadata
        env:
          V8_HASH: ${{ needs.build_common.outputs.v8_hash }}
          V8_VERSION: ${{ inputs.v8_version }}
        run: |
          set -euo pipefail
          echo "$V8_HASH" >deps/v8_hash
          ./deps/update_cgo.py
          display_version="${V8_VERSION:-$V8_HASH}"
          ./tools/modifychangelog.py \
            --unchanged '- Auto-bumped V8 .*' \
            --changed "- Auto-bumped V8 to $display_version." \
            --inplace \
            CHANGELOG.md

      - name: Upload assembled candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ needs.build_common.outputs.v8_hash }}
          if-no-files-found: error
          path: |
            cgo.go
            CHANGELOG.md
            deps/v8_hash
            deps/include/
            deps/include_libcxx/
            deps/include_libcxxabi/
            deps/include.SHA256SUMS
          retention-days: 2

  candidate_test:
    name: Test assembled candidate
    needs: [build_common, assemble]
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      sha: ${{ needs.build_common.outputs.base_sha }}
      candidate_hash: ${{ needs.build_common.outputs.v8_hash }}

  candidate_leakcheck:
    name: Leakcheck assembled candidate
    needs: [build_common, assemble]
    permissions:
      contents: read
    uses: ./.github/workflows/leakcheck.yml
    with:
      sha: ${{ needs.build_common.outputs.base_sha }}
      candidate_hash: ${{ needs.build_common.outputs.v8_hash }}

  stage:
    name: Stage exact release commit
    needs: [build_common, assemble, candidate_test, candidate_leakcheck]
    if: inputs.publish && inputs.v8_version != ''
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      staged: ${{ steps.result.outputs.staged }}
      sha: ${{ steps.result.outputs.sha }}
      base_sha: ${{ needs.build_common.outputs.base_sha }}
      branch: ${{ steps.result.outputs.branch }}
      version: ${{ steps.result.outputs.version }}
    steps:
      - name: Checkout trusted release base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          fetch-depth: 0
          ref: ${{ needs.build_common.outputs.base_sha }}

      - name: Remove previous generated release files
        run: |
          set -euo pipefail
          rm -rf deps/include deps/include_libcxx deps/include_libcxxabi
          for platform in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            find "deps/$platform" -maxdepth 1 -type f \
              \( -name 'cgo.go' -o -name 'lib*.a' -o -name libmanifest -o -name SHA256SUMS \) \
              -delete
          done

      - name: Download common candidate files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-${{ needs.build_common.outputs.v8_hash }}
          path: .

      - name: Download Darwin AMD64 files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: darwin_amd64-${{ needs.build_common.outputs.v8_hash }}
          path: deps/darwin_amd64

      - name: Download Darwin ARM64 files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: darwin_arm64-${{ needs.build_common.outputs.v8_hash }}
          path: deps/darwin_arm64

      - name: Download Linux AMD64 files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux_amd64-${{ needs.build_common.outputs.v8_hash }}
          path: deps/linux_amd64

      - name: Download Linux ARM64 files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux_arm64-${{ needs.build_common.outputs.v8_hash }}
          path: deps/linux_arm64

      - name: Verify official V8 tag
        env:
          V8_HASH: ${{ needs.build_common.outputs.v8_hash }}
          V8_VERSION: ${{ inputs.v8_version }}
        run: |
          set -euo pipefail
          [[ "$V8_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git -C deps/v8 fetch --depth=1 origin "$V8_HASH"
          git -C deps/v8 fetch --depth=1 origin "refs/tags/$V8_VERSION:refs/tags/$V8_VERSION"
          test "$(git -C deps/v8 rev-list -n1 "$V8_VERSION")" = "$V8_HASH"
          git -C deps/v8 checkout --detach "$V8_VERSION"

      - name: Verify downloaded checksums
        run: |
          set -euo pipefail
          (cd deps && sha256sum --check include.SHA256SUMS)
          for platform in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            (cd "deps/$platform" && sha256sum --check SHA256SUMS)
          done

      - id: result
        name: Commit and publish staging branch
        env:
          V8_HASH: ${{ needs.build_common.outputs.v8_hash }}
          EXPECTED_BASE_SHA: ${{ needs.build_common.outputs.base_sha }}
        run: |
          set -euo pipefail
          branch="automation/v8-${V8_HASH:0:12}"
          git checkout -b "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            cgo.go \
            CHANGELOG.md \
            deps/*_*/SHA256SUMS \
            deps/*_*/cgo.go \
            deps/*_*/lib*.a \
            deps/*_*/libmanifest \
            deps/include \
            deps/include.SHA256SUMS \
            deps/include_libcxx \
            deps/include_libcxxabi \
            deps/v8 \
            deps/v8_hash
          git diff --cached --check
          git commit -m "Add built V8 libraries at ${{ inputs.v8_version }}"
          artifact_sha="$(git rev-parse HEAD)"

          previous="$(git ls-remote --heads origin "refs/heads/$branch" | awk 'NR == 1 { print $1 }')"
          if [[ -n "$previous" ]]; then
            git push --force-with-lease="refs/heads/$branch:$previous" origin "HEAD:refs/heads/$branch"
          else
            git push origin "HEAD:refs/heads/$branch"
          fi

          submodules=( $(find deps -mindepth 2 -maxdepth 2 -name cgo.go -print | xargs -r -n1 dirname | sort) )
          go work init . "${submodules[@]}"
          repo="${GITHUB_REPOSITORY,,}"
          module_versions=()
          for submodule in "${submodules[@]}"; do
            module_versions+=("github.com/$repo/$submodule@$artifact_sha")
          done
          GOPROXY=direct go get "${module_versions[@]}"
          ./tools/modifychangelog.py --release '+0.1.0' --inplace CHANGELOG.md
          version="$(sed -nE 's/^## \[(v[0-9]+\.[0-9]+\.[0-9]+)\].*/\1/p' CHANGELOG.md | head -n1)"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git add go.mod go.sum CHANGELOG.md
          git diff --cached --check
          git commit -m "Stage $version"
          git push origin "HEAD:refs/heads/$branch"

          sha="$(git rev-parse HEAD)"
          test "$(git merge-base "$EXPECTED_BASE_SHA" "$sha")" = "$EXPECTED_BASE_SHA"
          echo "staged=true" >>"$GITHUB_OUTPUT"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "branch=$branch" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          {
            echo "V8 hash: $V8_HASH"
            echo "V8 version: ${{ inputs.v8_version }}"
            echo "Staging branch: $branch"
            echo "Staged commit: $sha"
            echo "v8go version: $version"
          } >>"$GITHUB_STEP_SUMMARY"
