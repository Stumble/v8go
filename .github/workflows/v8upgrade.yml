name: V8 Upgrade

on:
  schedule:
    - cron: '37 */4 * * *'
  pull_request:
    paths:
      - '.github/actions/setup-clang-21/action.yml'
      - '.github/workflows/leakcheck.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/test.yml'
      - '.github/workflows/v8build.yml'
      - '.github/workflows/v8stage.yml'
      - '.github/workflows/v8upgrade.yml'
      - 'cpuprofilenode_test.go'
      - 'deps/build.py'
      - 'deps/build_common.py'
      - 'deps/build-requirements.txt'
      - 'deps/update_cgo.py'
      - 'patches/**'
      - 'tools/v8_update.py'
      - 'tools/test_v8_update.py'
  workflow_dispatch:
    inputs:
      publish:
        description: Stage and publish a tagged update when running on master
        default: false
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: v8-upgrade
  cancel-in-progress: false

jobs:
  discover:
    name: Discover current Stable V8 branch tip
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: read
    outputs:
      base_sha: ${{ steps.decision.outputs.base_sha }}
      chrome_version: ${{ steps.upstream.outputs.chrome_version }}
      quarantine_reason: ${{ steps.upstream.outputs.quarantine_reason }}
      recovery: ${{ steps.decision.outputs.recovery }}
      recovery_sha: ${{ steps.decision.outputs.recovery_sha }}
      recovery_version: ${{ steps.decision.outputs.recovery_version }}
      should_build: ${{ steps.decision.outputs.should_build }}
      should_publish: ${{ steps.decision.outputs.should_publish }}
      state: ${{ steps.upstream.outputs.state }}
      v8_branch: ${{ steps.upstream.outputs.v8_branch }}
      v8_hash: ${{ steps.upstream.outputs.v8_hash }}
      v8_version: ${{ steps.upstream.outputs.v8_version }}
    steps:
      - name: Checkout trusted discovery code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Test discovery parser
        run: python3 -m unittest discover -s tools -p 'test_v8_update.py'

      - id: upstream
        name: Resolve Stable branch head and tag
        run: python3 tools/v8_update.py --github-output "$GITHUB_OUTPUT"

      - id: decision
        name: Decide build and publication path
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
          UPSTREAM_STATE: ${{ steps.upstream.outputs.state }}
          V8_HASH: ${{ steps.upstream.outputs.v8_hash }}
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          is_default=false
          if [[ "$GITHUB_REF" == refs/heads/master ]]; then
            is_default=true
          fi
          should_publish=false
          if [[ "$is_default" == true && ( "$GITHUB_EVENT_NAME" == schedule || "$REQUESTED_PUBLISH" == true ) ]]; then
            should_publish=true
          fi
          if [[ "$should_publish" == true ]]; then
            issues_enabled="$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)"
            if [[ "$issues_enabled" != true ]]; then
              echo "GitHub Issues must be enabled before automatic V8 publication" >&2
              exit 1
            fi
          fi

          should_build=false
          if [[ "$UPSTREAM_STATE" == release ]]; then
            should_build=true
          elif [[ "$UPSTREAM_STATE" == candidate ]]; then
            if [[ "$is_default" != true ]]; then
              should_build=true
            else
              marker="<!-- v8-upgrade-hash:$V8_HASH -->"
              base_marker="<!-- v8-upgrade-base:$base_sha -->"
              issues="$(gh issue list \
                --repo "$GITHUB_REPOSITORY" \
                --state all \
                --label v8-upgrade \
                --limit 1000 \
                --json body)"
              if ! jq -e --arg marker "$marker" \
                --arg base_marker "$base_marker" \
                '.[] | select((.body // "") | contains($marker)) | select((.body // "") | contains($base_marker)) | select((.body // "") | contains("<!-- v8-upgrade-state:candidate-passed -->"))' \
                <<<"$issues" >/dev/null; then
                should_build=true
              fi
            fi
          fi

          recovery=false
          recovery_sha=""
          recovery_version=""
          if [[ "$UPSTREAM_STATE" == current && "$should_publish" == true ]]; then
            recovery_version="$(sed -nE 's/^## \[(v[0-9]+\.[0-9]+\.[0-9]+)\].*/\1/p' CHANGELOG.md | head -n1)"
            [[ "$recovery_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            tag_refs="$(git ls-remote --tags origin \
              "refs/tags/$recovery_version" \
              "refs/tags/$recovery_version^{}")"
            tag_sha="$(awk '/\^\{\}$/ { print $1; found = 1 } !found && NR == 1 { first = $1 } END { if (!found) print first }' <<<"$tag_refs")"
            if [[ -n "$tag_sha" ]]; then
              git merge-base --is-ancestor "$tag_sha" "$base_sha"
            fi
            if [[ -z "$tag_sha" ]]; then
              recovery=true
              recovery_sha="$base_sha"
            elif ! gh release view "$recovery_version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              recovery=true
              recovery_sha="$tag_sha"
            fi
          fi

          echo "base_sha=$base_sha" >>"$GITHUB_OUTPUT"
          echo "recovery=$recovery" >>"$GITHUB_OUTPUT"
          echo "recovery_sha=$recovery_sha" >>"$GITHUB_OUTPUT"
          echo "recovery_version=$recovery_version" >>"$GITHUB_OUTPUT"
          echo "should_build=$should_build" >>"$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >>"$GITHUB_OUTPUT"
          {
            echo "Chrome Stable: ${{ steps.upstream.outputs.chrome_version }}"
            echo "V8 branch: ${{ steps.upstream.outputs.v8_branch }}"
            echo "V8 hash: $V8_HASH"
            echo "V8 version: ${{ steps.upstream.outputs.v8_version || 'untagged' }}"
            echo "State: $UPSTREAM_STATE"
            echo "Build: $should_build"
            echo "Publish: $should_publish"
            echo "Release recovery: $recovery"
          } >>"$GITHUB_STEP_SUMMARY"

  build_candidate:
    name: Build read-only Stable V8 candidate
    needs: discover
    if: needs.discover.outputs.should_build == 'true' && !(needs.discover.outputs.should_publish == 'true' && needs.discover.outputs.state == 'release')
    permissions:
      contents: read
    uses: ./.github/workflows/v8build.yml
    with:
      sha: ${{ needs.discover.outputs.base_sha }}
      v8_hash: ${{ needs.discover.outputs.v8_hash }}
      v8_version: ${{ needs.discover.outputs.v8_version }}

  build_release:
    name: Build publishable Stable V8 candidate
    needs: discover
    if: needs.discover.outputs.should_build == 'true' && needs.discover.outputs.should_publish == 'true' && needs.discover.outputs.state == 'release'
    permissions:
      contents: read
    uses: ./.github/workflows/v8build.yml
    with:
      sha: ${{ needs.discover.outputs.base_sha }}
      v8_hash: ${{ needs.discover.outputs.v8_hash }}
      v8_version: ${{ needs.discover.outputs.v8_version }}

  stage:
    name: Stage validated V8 release
    needs: [discover, build_release]
    if: needs.build_release.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/v8stage.yml
    with:
      base_sha: ${{ needs.build_release.outputs.base_sha }}
      v8_hash: ${{ needs.build_release.outputs.v8_hash }}
      v8_version: ${{ needs.discover.outputs.v8_version }}

  release:
    name: Release validated V8 update
    needs: [discover, stage]
    if: always() && needs.discover.result == 'success' && (needs.stage.outputs.staged == 'true' || needs.discover.outputs.recovery == 'true')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      sha: ${{ needs.stage.outputs.sha || needs.discover.outputs.recovery_sha }}
      base_sha: ${{ needs.stage.outputs.base_sha }}
      branch: ${{ needs.stage.outputs.branch }}
      version: ${{ needs.stage.outputs.version || needs.discover.outputs.recovery_version }}

  report:
    name: Update V8 upgrade tracking issue
    needs: [discover, build_candidate, build_release, stage, release]
    if: always() && github.ref == 'refs/heads/master' && (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-22.04
    permissions:
      issues: write
    steps:
      - name: Report durable upgrade state
        env:
          CANDIDATE_BUILD_RESULT: ${{ needs.build_candidate.result }}
          RELEASE_BUILD_RESULT: ${{ needs.build_release.result }}
          BASE_SHA: ${{ needs.discover.outputs.base_sha }}
          DISCOVERY_RESULT: ${{ needs.discover.result }}
          GH_TOKEN: ${{ github.token }}
          QUARANTINE_REASON: ${{ needs.discover.outputs.quarantine_reason }}
          RELEASE_RESULT: ${{ needs.release.result }}
          STAGE_RESULT: ${{ needs.stage.result }}
          UPSTREAM_STATE: ${{ needs.discover.outputs.state }}
          V8_HASH: ${{ needs.discover.outputs.v8_hash }}
          V8_VERSION: ${{ needs.discover.outputs.v8_version }}
        run: |
          set -euo pipefail
          BUILD_RESULT="$RELEASE_BUILD_RESULT"
          if [[ "$BUILD_RESULT" == skipped ]]; then
            BUILD_RESULT="$CANDIDATE_BUILD_RESULT"
          fi
          gh label create v8-upgrade \
            --repo "$GITHUB_REPOSITORY" \
            --color 1d76db \
            --description 'Automated Stable V8 upgrade state' \
            --force
          gh label create v8-upgrade-blocked \
            --repo "$GITHUB_REPOSITORY" \
            --color b60205 \
            --description 'Automation requires maintainer action' \
            --force

          if [[ "$DISCOVERY_RESULT" != success ]]; then
            marker='<!-- v8-upgrade-health -->'
            title='[V8 upgrade] Stable discovery is blocked'
            state=blocked
            detail="Discovery failed before a trustworthy V8 hash was available."
          else
            marker="<!-- v8-upgrade-hash:$V8_HASH -->"
            title="[V8 upgrade] ${V8_VERSION:-untagged $V8_HASH}"
            state=blocked
            detail="The automated upgrade did not reach a releasable state."
            if [[ "$UPSTREAM_STATE" == quarantined ]]; then
              detail="The Stable V8 hash is quarantined: $QUARANTINE_REASON"
            elif [[ "$UPSTREAM_STATE" == candidate && ( "$BUILD_RESULT" == success || "$BUILD_RESULT" == skipped ) ]]; then
              state=candidate-passed
              detail="The untagged Stable tip passed candidate validation and is waiting for an official V8 tag."
            elif [[ "$UPSTREAM_STATE" == current && ( "$RELEASE_RESULT" == success || "$RELEASE_RESULT" == skipped ) ]]; then
              state=current
              detail="The current Stable V8 hash is already released."
            elif [[ "$UPSTREAM_STATE" == release && "$RELEASE_RESULT" == success ]]; then
              state=released
              detail="The tagged Stable V8 update was released successfully."
            elif [[ "$BUILD_RESULT" == failure || "$BUILD_RESULT" == cancelled ]]; then
              detail="Candidate build or validation ended with: $BUILD_RESULT."
            elif [[ "$STAGE_RESULT" == failure || "$STAGE_RESULT" == cancelled ]]; then
              detail="Release staging ended with: $STAGE_RESULT."
            elif [[ "$RELEASE_RESULT" == failure || "$RELEASE_RESULT" == cancelled ]]; then
              detail="Promotion or release ended with: $RELEASE_RESULT."
            fi
          fi

          issues="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state all \
            --label v8-upgrade \
            --limit 1000 \
            --json number,body,state,labels)"
          number="$(jq -r --arg marker "$marker" \
            '[.[] | select((.body // "") | contains($marker))][0].number // empty' \
            <<<"$issues")"

          if [[ "$DISCOVERY_RESULT" == success ]]; then
            jq -r --arg marker "$marker" \
              '.[] | select(.state == "OPEN") | select((.body // "") | contains("<!-- v8-upgrade-state:candidate-passed -->")) | select(((.body // "") | contains($marker)) | not) | .number' \
              <<<"$issues" \
              | while read -r superseded; do
                  gh issue close "$superseded" --repo "$GITHUB_REPOSITORY" \
                    --comment "Superseded by the newer Stable V8 state."
                done
          fi

          if [[ "$state" == released || "$state" == current ]]; then
            if [[ -n "$number" ]] && jq -e --argjson number "$number" \
              '.[] | select(.number == $number and .state == "OPEN")' <<<"$issues" >/dev/null; then
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
                --comment "$detail Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
            exit 0
          fi

          body="$RUNNER_TEMP/v8-upgrade.md"
          {
            echo "$marker"
            echo "<!-- v8-upgrade-base:${BASE_SHA:-unknown} -->"
            echo "<!-- v8-upgrade-state:$state -->"
            echo
            echo "$detail"
            echo
            echo "- V8 hash: \`${V8_HASH:-unknown}\`"
            echo "- V8 version: \`${V8_VERSION:-untagged}\`"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "The next scheduled run retries non-quarantined failures. Do not close this issue until the state is resolved or superseded."
          } >"$body"

          labels=(--add-label v8-upgrade)
          if [[ "$state" == blocked ]]; then
            labels+=(--add-label v8-upgrade-blocked)
          fi
          if [[ -n "$number" ]]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body-file "$body" --add-assignee Stumble "${labels[@]}"
            if [[ "$state" != blocked ]] && jq -e --argjson number "$number" \
              '.[] | select(.number == $number) | .labels[]? | select(.name == "v8-upgrade-blocked")' \
              <<<"$issues" >/dev/null; then
              gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --remove-label v8-upgrade-blocked
            fi
            if jq -e --argjson number "$number" \
              '.[] | select(.number == $number and .state == "CLOSED")' <<<"$issues" >/dev/null; then
              gh issue reopen "$number" --repo "$GITHUB_REPOSITORY"
            fi
          else
            create_labels=(--label v8-upgrade)
            if [[ "$state" == blocked ]]; then
              create_labels+=(--label v8-upgrade-blocked)
            fi
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body-file "$body" --assignee Stumble "${create_labels[@]}"
          fi
