name: Test

permissions:
  contents: read

on:
  push:
    branches:
    - master
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate_hash:
        description: Candidate artifact hash to overlay before testing.
        required: false
        type: string
      sha:
        description: "The commit to check out at. Defaults to the parent workflow's github.sha."
        required: false
        type: string

jobs:
  test:
    name: Tests on ${{ matrix.target.os }} ${{ matrix.target.arch }} with Go ${{ matrix.go-version }}
    strategy:
      matrix:
        target:
          - os: linux
            arch: amd64
            runner: ubuntu-22.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
        go-version:
        # Check the earliest and two trailing versions, to keep
        # maintainance of this file reasonable.
        - 1.24
        - oldstable
        - stable
    runs-on: ${{ matrix.target.runner }}
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ inputs.sha }}

    - name: Remove previous generated candidate files
      if: inputs.candidate_hash != ''
      env:
        PLATFORM: ${{ matrix.target.os }}_${{ matrix.target.arch }}
      run: |
        set -euo pipefail
        rm -rf deps/include deps/include_libcxx deps/include_libcxxabi
        find "deps/$PLATFORM" -maxdepth 1 -type f \
          \( -name 'cgo.go' -o -name 'lib*.a' -o -name libmanifest -o -name SHA256SUMS \) \
          -delete

    - name: Overlay candidate common files
      if: inputs.candidate_hash != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: candidate-${{ inputs.candidate_hash }}
        path: .

    - name: Overlay candidate platform files
      if: inputs.candidate_hash != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ matrix.target.os }}_${{ matrix.target.arch }}-${{ inputs.candidate_hash }}
        path: deps/${{ matrix.target.os }}_${{ matrix.target.arch }}

    - name: Verify candidate checksums
      if: inputs.candidate_hash != ''
      env:
        PLATFORM: ${{ matrix.target.os }}_${{ matrix.target.arch }}
      run: |
        set -euo pipefail
        check_sha256() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum --check "$1"
          else
            shasum --algorithm 256 --check "$1"
          fi
        }
        (cd deps && check_sha256 include.SHA256SUMS)
        (cd "deps/$PLATFORM" && check_sha256 SHA256SUMS)

    - name: Install Clang 21
      uses: ./.github/actions/setup-clang-21

    - name: Install Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: ${{ matrix.go-version }}

    - name: Add GOPATH to GITHUB_ENV
      run: echo "GOPATH=$(go env GOPATH)" >>"$GITHUB_ENV"

    - name: Set Up Workspace
      # Submodules shouldn't cause a download.
      run: |
        set -euo pipefail
        submodules=()
        for cgo_file in ./deps/*_*/cgo.go; do
          submodules+=("${cgo_file%/cgo.go}")
        done
        go work init . "${submodules[@]}"

    - name: Run Tests With Coverage
      run: go test -v -coverprofile coverage.out ./...
      env:
        CGO_CXXFLAGS: "-nostdinc++ -Werror -Wno-error=#warnings"

    - name: Upload Coverage To Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      if: env._HAS_CODECOV_TOKEN == 'true'
      env:
        _HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
        OS: ${{ matrix.target.os }}
        ARCH: ${{ matrix.target.arch }}
        PLATFORM: ${{ matrix.target.runner }}
        GO: ${{ matrix.go-version }}
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.out
        flags: unittests
        fail_ci_if_error: true
        env_vars: OS,ARCH,PLATFORM,GO

    - name: Scan and Upload FOSSA Data
      if: env.FOSSA_API_KEY != '' && github.ref == 'refs/heads/master'
      uses: fossas/fossa-action@4ece07243d21a80f452ae608440a2295a2937700 # main (Node 24, pinned)
      with:
        api-key: ${{ secrets.FOSSA_API_KEY }}
        pinned-cli-version: v3.17.16
      env:
        FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
