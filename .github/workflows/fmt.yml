name: Code Format

on:
  push:
    branches:
    - master
  pull_request:
  workflow_dispatch:

jobs:
  fmt:
    name: Check Code Format and Style
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install Clang 21
      run: |
        curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
        chmod +x "$RUNNER_TEMP/llvm.sh"
        sudo "$RUNNER_TEMP/llvm.sh" 21
        echo "CC=clang-21" >>"$GITHUB_ENV"
        echo "CXX=clang++-21" >>"$GITHUB_ENV"

    - name: go fmt
      run: go fmt

    - name: go vet
      env:
        CGO_CXXFLAGS: "-nostdinc++"
      run: go vet

    - name: go generate (clang-format)
      run: go generate

    - name: Display missing format changes
      run: git diff --exit-code
