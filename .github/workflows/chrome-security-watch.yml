name: Chrome Security Watch

on:
  schedule:
    - cron: '17 * * * *'
  pull_request:
    paths:
      - '.github/workflows/chrome-security-watch.yml'
      - 'tools/chrome_security.py'
      - 'tools/test_chrome_security.py'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Render notices without changing GitHub Issues
        default: true
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: chrome-security-watch
  cancel-in-progress: false

jobs:
  dry_run:
    name: Preview official Chrome Stable security posts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout proposed parser
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Test parser
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Render triage preview
        run: >-
          python3 tools/chrome_security.py
          --repository "$GITHUB_REPOSITORY"
          --assignee Stumble
          --since-days 14
          --dry-run

  watch:
    name: Review official Chrome Stable security posts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted parser
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Test parser
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Sync triage issues
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(
            --repository "$GITHUB_REPOSITORY"
            --assignee Stumble
            --since-days 14
          )
          if [[ "$GITHUB_REF" != refs/heads/master || "$REQUESTED_DRY_RUN" == true ]]; then
            args+=(--dry-run)
          fi
          python3 tools/chrome_security.py "${args[@]}"
