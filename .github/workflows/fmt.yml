name: Code Format

permissions:
  contents: read

on:
  push:
    branches:
    - master
  pull_request:
  workflow_dispatch:

jobs:
  fmt:
    name: Check Code Format and Style
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: 1

    - name: Install Clang 21
      uses: ./.github/actions/setup-clang-21

    - name: go fmt
      run: go fmt

    - name: go vet
      env:
        CGO_CXXFLAGS: "-nostdinc++"
      run: go vet

    - name: go generate (clang-format)
      run: go generate

    - name: Display missing format changes
      run: git diff --exit-code
